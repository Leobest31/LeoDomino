<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" role="img" aria-label="LeoDomino">
  <defs>
    <linearGradient id="splashGold" x1="40" y1="220" x2="320" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6E7A8"/>
      <stop offset="0.45" stop-color="#E8C547"/>
      <stop offset="1" stop-color="#8A6818"/>
    </linearGradient>
    <linearGradient id="splashTile" x1="140" y1="40" x2="220" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFCF6"/>
      <stop offset="0.5" stop-color="#F3EEE4"/>
      <stop offset="1" stop-color="#D8CFBF"/>
    </linearGradient>
    <filter id="splashGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#C9A227" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Centered 3-6 tile -->
  <g filter="url(#splashGlow)">
    <rect x="138" y="48" width="84" height="132" rx="12" fill="url(#splashTile)" stroke="#2A2318" stroke-width="3"/>
    <line x1="154" y1="114" x2="206" y2="114" stroke="#2A2318" stroke-width="3" stroke-linecap="round"/>
    <circle cx="158" cy="70" r="5.5" fill="#1A1814"/>
    <circle cx="180" cy="82" r="5.5" fill="#1A1814"/>
    <circle cx="202" cy="94" r="5.5" fill="#1A1814"/>
    <circle cx="158" cy="134" r="5.5" fill="#1A1814"/>
    <circle cx="158" cy="150" r="5.5" fill="#1A1814"/>
    <circle cx="158" cy="166" r="5.5" fill="#1A1814"/>
    <circle cx="202" cy="134" r="5.5" fill="#1A1814"/>
    <circle cx="202" cy="150" r="5.5" fill="#1A1814"/>
    <circle cx="202" cy="166" r="5.5" fill="#1A1814"/>
  </g>
  <text
    x="180"
    y="248"
    text-anchor="middle"
    fill="url(#splashGold)"
    filter="url(#splashGlow)"
    font-family="Georgia, 'Source Serif 4', 'Times New Roman', serif"
    font-size="48"
    font-weight="700"
    letter-spacing="1"
  >LeoDomino</text>
</svg>
